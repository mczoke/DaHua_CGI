{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-hdd-stack"></i> 设备管理</h5>
                <div>
                    <button class="btn btn-outline-light btn-sm" onclick="showDeviceModal()"><i class="bi bi-plus-lg"></i> 手动添加</button>
                    <button class="btn btn-success btn-sm" onclick="pingSelected()"><i class="bi bi-wifi"></i> Ping检测</button>
                    <a href="/api/template/download" class="btn btn-info btn-sm"><i class="bi bi-download"></i> 下载模板</a>
                    <button class="btn btn-primary btn-sm" onclick="showUploadModal()"><i class="bi bi-upload"></i> 上传Excel</button>
                    <button class="btn btn-danger btn-sm" onclick="clearDevices()"><i class="bi bi-trash"></i> 清空设备</button>
                    <button class="btn btn-warning btn-sm" onclick="deleteSelected()"><i class="bi bi-x-lg"></i> 删除选中</button>
                </div>
            </div>
            <div class="card-body">
                <!-- 进度条 -->
                <div id="pingProgress" class="mb-3" style="display:none">
                    <div class="d-flex justify-content-between mb-1">
                        <span id="pingStatus">检测中...</span>
                        <span id="pingPercent">0%</span>
                    </div>
                    <div class="progress" style="height:8px">
                        <div id="pingBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width:0%"></div>
                    </div>
                </div>

                <!-- 设备统计 -->
                <div class="row mb-3">
                    <div class="col-3"><span class="badge bg-secondary" id="statTotal">总数: 0</span></div>
                    <div class="col-3"><span class="badge bg-success" id="statOnline">在线: 0</span></div>
                    <div class="col-3"><span class="badge bg-danger" id="statOffline">离线: 0</span></div>
                    <div class="col-3"><span class="badge bg-primary" id="statSelected">选中: 0</span></div>
                </div>

                <!-- 选择操作 -->
                <div class="btn-group btn-group-sm mb-2">
                    <button class="btn btn-outline-light" onclick="selectMode('all')">全选</button>
                    <button class="btn btn-outline-light" onclick="selectMode('none')">全不选</button>
                    <button class="btn btn-outline-light" onclick="selectMode('online')">选在线</button>
                    <button class="btn btn-outline-light" onclick="selectMode('invert')">反选</button>
                </div>

                <!-- 设备表格 -->
                <div class="table-responsive" style="max-height:600px;overflow-y:auto">
                    <table class="table table-dark table-hover table-sm" id="deviceTable">
                        <thead>
                            <tr>
                                <th style="width:40px">#</th>
                                <th style="width:40px"><input type="checkbox" onchange="toggleAll(this)"></th>
                                <th>IP地址</th>
                                <th>端口</th>
                                <th>用户名</th>
                                <th>状态</th>
                                <th>在线</th>
                                <th>消息</th>
                                <th style="width:72px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="deviceTableBody">
                            <tr><td colspan="9" class="text-center text-muted">未加载设备，请上传 Excel 文件或手动添加</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 手动维护 Modal -->
<div class="modal fade" id="deviceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark">
            <div class="modal-header">
                <h5 class="modal-title" id="deviceModalTitle">手动添加设备</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="deviceEditIndex">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label" for="deviceIp">IP 地址</label>
                        <input class="form-control" id="deviceIp" inputmode="decimal" placeholder="10.17.1.61">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="devicePort">端口</label>
                        <input class="form-control" id="devicePort" inputmode="numeric" value="80">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="deviceUsername">用户名</label>
                        <input class="form-control" id="deviceUsername" value="admin">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="devicePassword">密码</label>
                        <input class="form-control" id="devicePassword" type="password">
                        <div class="form-text text-muted" id="devicePasswordHint"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveDevice()">保存设备</button>
            </div>
        </div>
    </div>
</div>

<!-- 上传 Modal -->
<div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark">
            <div class="modal-header">
                <h5 class="modal-title">上传设备列表</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="excelFile" class="form-label">选择 Excel 文件（.xlsx / .xls）</label>
                    <input type="file" class="form-control" id="excelFile" accept=".xlsx,.xls">
                </div>
                <div class="alert alert-info">
                    <small>提示：请先<a href="/api/template/download" class="alert-link">下载模板</a>填写设备信息</small>
                </div>
                <div class="alert alert-info">
                    <small>Excel 前 4 列必须为 IP地址 / 端口 / 用户名 / 密码；第 5 列起可直接填写要写入的 CGI 参数名</small>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="uploadExcel()">上传</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let deviceList = [];

function showUploadModal() {
    const modal = new bootstrap.Modal(document.getElementById('uploadModal'));
    modal.show();
}

function uploadExcel() {
    const fileInput = document.getElementById('excelFile');
    if (!fileInput.files || !fileInput.files[0]) {
        showToast('请选择文件', 'warning');
        return;
    }
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    fetch('/api/devices/upload', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(d => {
            if (d.error) { showToast(d.error, 'danger'); return; }
            showToast(`加载成功: ${d.devices_count} 台设备`, 'success');
            bootstrap.Modal.getInstance(document.getElementById('uploadModal')).hide();
            refreshDevices();
        })
        .catch(e => showToast('上传失败: ' + e, 'danger'));
}

function refreshDevices() {
    fetch('/api/devices').then(r=>r.json()).then(d=>{
        deviceList = d.devices || [];
        renderDevices();
    });
}

function renderDevices() {
    const tbody = document.getElementById('deviceTableBody');
    if (deviceList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">没有设备</td></tr>';
        updateStats();
        return;
    }
    let html = '';
    deviceList.forEach((dev, i) => {
        const statusBadge = dev.online
            ? '<span class="badge bg-success">在线</span>'
            : (dev.status === '未检测' ? '<span class="badge bg-secondary">未检测</span>' : '<span class="badge bg-danger">离线</span>');
        html += `<tr>
            <td>${i+1}</td>
            <td><input type="checkbox" class="dev-cb" data-index="${i}" ${dev.selected?'checked':''} onchange="toggleDevice(${i})"></td>
            <td>${escapeHtml(dev.ip)}</td>
            <td>${escapeHtml(dev.port)}</td>
            <td>${escapeHtml(dev.username)}</td>
            <td>${statusBadge}</td>
            <td>${dev.online ? '<i class="bi bi-check-circle text-success"></i>' : '<i class="bi bi-x-circle text-danger"></i>'}</td>
            <td><small class="text-muted">${escapeHtml(dev.last_message || '')}</small></td>
            <td>
                <button class="btn btn-outline-info btn-sm" type="button" onclick="showDeviceModal(${i})" title="编辑设备">
                    <i class="bi bi-pencil"></i>
                </button>
            </td>
        </tr>`;
    });
    tbody.innerHTML = html;
    updateStats();
}

function showDeviceModal(index = null) {
    const editing = index !== null;
    const device = editing ? deviceList[index] : null;
    document.getElementById('deviceModalTitle').textContent = editing ? '编辑设备' : '手动添加设备';
    document.getElementById('deviceEditIndex').value = editing ? String(index) : '';
    document.getElementById('deviceIp').value = device ? device.ip : '';
    document.getElementById('devicePort').value = device ? device.port : '80';
    document.getElementById('deviceUsername').value = device ? device.username : 'admin';
    document.getElementById('devicePassword').value = '';
    document.getElementById('devicePassword').placeholder = editing ? '留空则保留原密码' : '';
    document.getElementById('devicePasswordHint').textContent = editing ? '留空不会修改原密码' : '';
    new bootstrap.Modal(document.getElementById('deviceModal')).show();
}

function saveDevice() {
    const index = document.getElementById('deviceEditIndex').value;
    const payload = {
        ip: document.getElementById('deviceIp').value.trim(),
        port: document.getElementById('devicePort').value.trim(),
        username: document.getElementById('deviceUsername').value.trim(),
        password: document.getElementById('devicePassword').value,
    };
    const url = index === '' ? '/api/devices/add' : `/api/devices/${index}`;
    fetch(url, {
        method: index === '' ? 'POST' : 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
    }).then(r => r.json()).then(data => {
        if (data.error) {
            showToast(data.error, 'danger');
            return;
        }
        bootstrap.Modal.getInstance(document.getElementById('deviceModal')).hide();
        showToast(index === '' ? '设备已添加并选中' : '设备信息已更新', 'success');
        refreshDevices();
    }).catch(error => showToast('保存失败: ' + error, 'danger'));
}

function updateStats() {
    const total = deviceList.length;
    const online = deviceList.filter(d => d.online).length;
    const offline = deviceList.filter(d => !d.online && d.status !== '未检测').length;
    const selected = deviceList.filter(d => d.selected).length;
    document.getElementById('statTotal').textContent = `总数: ${total}`;
    document.getElementById('statOnline').textContent = `在线: ${online}`;
    document.getElementById('statOffline').textContent = `离线: ${offline}`;
    document.getElementById('statSelected').textContent = `选中: ${selected}`;
}

function clearDevices() {
    if (!confirm('确定清空所有已上传的设备？')) return;
    fetch('/api/devices/clear', {method: 'POST'})
        .then(r=>r.json())
        .then(d => {
            if (d.success) {
                showToast('已清空所有设备', 'success');
                refreshDevices();
            }
        })
        .catch(e => showToast('清空失败: ' + e, 'danger'));
}

function deleteSelected() {
    const checkedBoxes = Array.from(document.querySelectorAll('.dev-cb:checked'));
    if (checkedBoxes.length === 0) {
        showToast('没有选中的设备', 'warning');
        return;
    }
    if (!confirm('确定删除选中的 ' + checkedBoxes.length + ' 台设备？')) return;
    const indices = checkedBoxes.map(cb => parseInt(cb.dataset.index, 10)).filter(Number.isInteger);
    fetch('/api/devices/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({indices: indices})
    })
        .then(r=>r.json())
        .then(d => {
            if (d.success) {
                showToast('已删除 ' + d.deleted + ' 台设备', 'success');
                refreshDevices();
            } else {
                showToast('删除失败: ' + (d.error || '未知错误'), 'danger');
            }
        })
        .catch(e => showToast('删除失败: ' + e, 'danger'));
}

function selectMode(mode) {
    fetch('/api/devices/select', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mode: mode})
    }).then(r=>r.json()).then(()=>refreshDevices());
}

function toggleAll(cb) {
    selectMode(cb.checked ? 'all' : 'none');
}

function toggleDevice(idx) {
    fetch('/api/devices/select', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mode: 'toggle', index: idx})
    }).then(r=>r.json()).then(()=>refreshDevices());
}

function pingSelected() {
    const selected = deviceList.filter(d => d.selected);
    if (selected.length === 0) { showToast('没有选中的设备', 'warning'); return; }
    document.getElementById('pingProgress').style.display = 'block';
    document.getElementById('pingBar').style.width = '0%';
    document.getElementById('pingPercent').textContent = '0%';
    document.getElementById('pingStatus').textContent = `Ping检测 ${selected.length} 台设备...`;

    fetch('/api/devices/ping', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({selected_only: true})
    }).then(r=>r.json()).then(d=>{
        if (d.error) { showToast(d.error, 'danger'); return; }
        showToast(d.message, 'info');
        // 轮询进度
        const iv = setInterval(() => {
            fetch('/api/devices/status').then(r=>r.json()).then(s=>{
                const p = s.progress || {};
                const pc = p.percent || 0;
                document.getElementById('pingBar').style.width = pc + '%';
                document.getElementById('pingPercent').textContent = pc + '%';
                if (pc >= 100) {
                    clearInterval(iv);
                    document.getElementById('pingStatus').textContent = '检测完成';
                    refreshDevices();
                    setTimeout(()=>{document.getElementById('pingProgress').style.display='none';}, 2000);
                }
            });
        }, 500);
    });
}

function escapeHtml(value) {
    const element = document.createElement('div');
    element.textContent = String(value ?? '');
    return element.innerHTML;
}

// 每 3 秒自动刷新
setInterval(refreshDevices, 3000);
refreshDevices();
</script>
{% endblock %}
