{% extends "base.html" %}
{% block content %}
<div class="ops-page">
    <section class="panel-box ops-panel ops-results-panel ops-logs-panel">
        <div class="ops-panel-header">
            <h6 class="mb-0"><i class="bi bi-journal-text"></i> 日志查看</h6>
            <div class="ops-panel-actions">
                <select class="form-select form-select-sm" style="width:auto" id="logSource" onchange="switchLogSource()">
                    <option value="buffer">实时日志</option>
                    <option value="detailed">详细日志</option>
                    <option value="failure">失败日志</option>
                </select>
                <button class="btn btn-outline-light btn-sm" onclick="refreshLogs()"><i class="bi bi-arrow-clockwise"></i> 刷新</button>
                <button class="btn btn-outline-danger btn-sm" onclick="clearLogs()"><i class="bi bi-trash"></i> 清空</button>
            </div>
        </div>

        <div class="mb-2">
            <div class="btn-group btn-group-sm" id="logLevelFilter">
                <button class="btn btn-outline-secondary active" data-level="ALL" onclick="filterLogLevel('ALL')">全部</button>
                <button class="btn btn-outline-info" data-level="INFO" onclick="filterLogLevel('INFO')">INFO</button>
                <button class="btn btn-outline-warning" data-level="WARNING" onclick="filterLogLevel('WARNING')">WARNING</button>
                <button class="btn btn-outline-danger" data-level="ERROR" onclick="filterLogLevel('ERROR')">ERROR</button>
            </div>
        </div>

        <div class="result-scroll log-content-scroll">
            <pre id="logContent" class="mb-0 text-light" style="white-space:pre-wrap;word-break:break-all;padding:10px">等待日志...</pre>
        </div>
        <div class="mt-2">
            <small class="text-muted" id="logInfo"></small>
        </div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
let logLevelFilter = 'ALL';
let logAutoRefresh = null;

function refreshLogs() {
    const source = document.getElementById('logSource').value;
    fetch(`/api/logs?type=${source}&lines=500`)
        .then(r => r.json())
        .then(d => {
            const logs = d.logs || [];
            renderLogs(logs, source);
            document.getElementById('logInfo').textContent = d.file
                ? `文件: ${d.file} (共 ${d.total_lines || 0} 行, 显示 ${logs.length} 行)`
                : `共 ${logs.length} 条日志`;
        });
}

function renderLogs(logs, source) {
    const el = document.getElementById('logContent');
    if (logs.length === 0) {
        el.textContent = '暂无日志';
        return;
    }
    let html = '';
    logs.forEach(line => {
        // 如果是 buffer 模式，line 是 {time, level, message}
        if (typeof line === 'object') {
            const level = line.level || 'INFO';
            if (logLevelFilter !== 'ALL' && level !== logLevelFilter) return;
            let color = '#ccc';
            if (level === 'ERROR') color = '#f44';
            else if (level === 'WARNING') color = '#fa0';
            else if (level === 'SUCCESS') color = '#4c4';
            else if (level === 'INFO') color = '#8cf';
            html += `<span style="color:${color}">[${line.time}] [${level}] ${line.message}</span>\n`;
        } else {
            // 文本文件行
            let color = '#ccc';
            if (line.includes('[ERROR]')) color = '#f44';
            else if (line.includes('[WARNING]')) color = '#fa0';
            html += `<span style="color:${color}">${escapeHtml(line)}</span>\n`;
        }
    });
    el.innerHTML = html || '<span class="text-muted">没有匹配的日志</span>';
    el.parentElement.scrollTop = el.parentElement.scrollHeight;
}

function switchLogSource() {
    refreshLogs();
    if (document.getElementById('logSource').value === 'buffer') {
        // 自动刷新
        if (logAutoRefresh) clearInterval(logAutoRefresh);
        logAutoRefresh = setInterval(refreshLogs, 2000);
    } else {
        if (logAutoRefresh) clearInterval(logAutoRefresh);
        logAutoRefresh = null;
    }
}

function filterLogLevel(level) {
    logLevelFilter = level;
    document.querySelectorAll('#logLevelFilter .btn').forEach(b => {
        b.classList.toggle('active', b.dataset.level === level);
    });
    refreshLogs();
}

function clearLogs() {
    if (!confirm('确定清空实时日志吗？')) return;
    fetch('/api/logs/clear', { method: 'POST' })
        .then(r => r.json())
        .then(() => { document.getElementById('logContent').textContent = '日志已清空'; });
}

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// 初始加载
refreshLogs();
switchLogSource();
</script>
{% endblock %}
