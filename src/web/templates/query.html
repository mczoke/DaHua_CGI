{% extends "base.html" %}
{% block content %}
<div class="row">
    <!-- 左侧：设备选择 -->
    <div class="col-md-3">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-hdd-stack"></i> 目标设备</h5>
            </div>
            <div class="card-body">
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="selectAllDevices" checked onchange="toggleDeviceSelection(this)">
                    <label class="form-check-label">全选/取消</label>
                </div>
                <div id="deviceCheckList" class="border rounded p-2" style="max-height:400px;overflow-y:auto">
                    <div class="text-muted small">未加载设备</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧：查询界面 -->
    <div class="col-md-9">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-search"></i> CGI批量查询</h5>
                <div>
                    <button class="btn btn-primary btn-sm" onclick="startQuery()" id="queryBtn"><i class="bi bi-play-fill"></i> 开始查询</button>
                    <button class="btn btn-success btn-sm" onclick="exportQuery()" id="exportBtn" disabled><i class="bi bi-download"></i> 导出结果</button>
                </div>
            </div>
            <div class="card-body">
                <!-- 命令输入 -->
                <div class="mb-3">
                    <label class="form-label">CGI查询命令（每行一个）</label>
                    <textarea class="form-control bg-dark text-light" id="queryCommands" rows="6" placeholder="输入CGI命令名称，每行一个&#10;例如:&#10;Alarm&#10;VideoInMode&#10;VideoInChannel">Alarm
VideoInMode
VideoInChannel</textarea>
                    <div class="form-text text-muted">
                        <small>纯命令名模式（自动拼接标准CGI URL）。<br>
                        自定义URL模式：直接输入完整URL，支持 {{IP}} {{port}} {{username}} {{password}} 变量替换。</small>
                    </div>
                </div>

                <!-- 进度条 -->
                <div id="queryProgress" class="mb-3" style="display:none">
                    <div class="d-flex justify-content-between mb-1">
                        <span id="queryStatus">查询中...</span>
                        <span id="queryPercent">0%</span>
                    </div>
                    <div class="progress" style="height:8px">
                        <div id="queryBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width:0%"></div>
                    </div>
                </div>

                <!-- 结果表格 -->
                <div id="queryResultSection" style="display:none">
                    <h6><i class="bi bi-table"></i> 查询结果</h6>
                    <div class="table-responsive" style="max-height:500px;overflow-y:auto">
                        <table class="table table-dark table-sm table-hover table-bordered" id="queryResultTable">
                            <thead id="queryResultHead"></thead>
                            <tbody id="queryResultBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let queryColumns = [];
let queryData = [];
let deviceList = [];

// 获取设备列表
function refreshDevices() {
    fetch('/api/devices').then(r=>r.json()).then(d => {
        deviceList = d.devices || [];
        renderDeviceList();
    });
}

function renderDeviceList() {
    const container = document.getElementById('deviceCheckList');
    if (deviceList.length === 0) {
        container.innerHTML = '<div class="text-muted small">未加载设备</div>';
        return;
    }
    let html = '';
    deviceList.forEach((dev, i) => {
        const statusIcon = dev.online ? '✅' : (dev.status === '未检测' ? '⚪' : '❌');
        html += `<div class="form-check">
            <input class="form-check-input dev-cb" type="checkbox" value="${i}" id="dev_${i}" ${dev.selected?'checked':''}>
            <label class="form-check-label small" for="dev_${i}">
                ${statusIcon} ${dev.ip}:${dev.port}
            </label>
        </div>`;
    });
    container.innerHTML = html;
}

function toggleDeviceSelection(cb) {
    document.querySelectorAll('.dev-cb').forEach(c => c.checked = cb.checked);
}

function getSelectedDevices() {
    return Array.from(document.querySelectorAll('.dev-cb:checked')).map(c => parseInt(c.value));
}

function startQuery() {
    const selected = getSelectedDevices();
    if (selected.length === 0) {
        showToast('请至少选择一个设备', 'warning');
        return;
    }

    const commands = document.getElementById('queryCommands').value.trim().split('\n')
        .map(l => l.trim()).filter(l => l && !l.startsWith('#'));

    if (commands.length === 0) {
        showToast('请至少输入一个查询命令', 'warning');
        return;
    }

    // 显示进度
    document.getElementById('queryProgress').style.display = 'block';
    document.getElementById('queryBar').style.width = '0%';
    document.getElementById('queryPercent').textContent = '0%';
    document.getElementById('queryStatus').textContent = '查询中...';
    document.getElementById('queryBtn').disabled = true;
    document.getElementById('exportBtn').disabled = true;

    // 发送查询请求
    fetch('/api/query/execute', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({devices: selected, commands: commands, selected_only: false})
    }).then(r => r.json()).then(d => {
        if (d.error) {
            showToast(d.error, 'danger');
            document.getElementById('queryBtn').disabled = false;
            document.getElementById('queryProgress').style.display = 'none';
            return;
        }
        queryColumns = d.columns;
        queryData = d.data;
        renderQueryResults();
        document.getElementById('queryStatus').textContent = '查询完成';
        document.getElementById('queryBar').style.width = '100%';
        document.getElementById('queryPercent').textContent = '100%';
        document.getElementById('queryBtn').disabled = false;
        document.getElementById('exportBtn').disabled = false;
        setTimeout(() => { document.getElementById('queryProgress').style.display = 'none'; }, 2000);
        showToast(`查询完成: ${d.count} 台设备`, 'success');
    }).catch(e => {
        showToast('查询失败: ' + e, 'danger');
        document.getElementById('queryBtn').disabled = false;
        document.getElementById('queryProgress').style.display = 'none';
    });
}

function renderQueryResults() {
    if (!queryColumns || queryColumns.length === 0) return;

    document.getElementById('queryResultSection').style.display = 'block';

    // 渲染表头
    const thead = document.getElementById('queryResultHead');
    let headerHtml = '<tr>';
    queryColumns.forEach(col => {
        headerHtml += `<th class="small">${col}</th>`;
    });
    headerHtml += '</tr>';
    thead.innerHTML = headerHtml;

    // 渲染数据
    const tbody = document.getElementById('queryResultBody');
    let bodyHtml = '';
    queryData.forEach(row => {
        bodyHtml += '<tr>';
        row.forEach((val, idx) => {
            const colName = queryColumns[idx] || '';
            let cls = '';
            if (colName === 'Ping状态') {
                cls = val === '在线' ? 'text-success' : (val === '离线' ? 'text-danger' : '');
            } else if (colName === '账号验证') {
                cls = val === '通过' ? 'text-success' : (val === '失败' ? 'text-danger' : 'text-warning');
            }
            bodyHtml += `<td class="small ${cls}">${escapeHtml(val)}</td>`;
        });
        bodyHtml += '</tr>';
    });
    tbody.innerHTML = bodyHtml;
}

function exportQuery() {
    if (!queryData || queryData.length === 0) {
        showToast('没有查询结果可导出', 'warning');
        return;
    }
    // 触发文件下载
    window.location.href = '/api/query/export';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showToast(msg, type) {
    const container = document.getElementById('toastContainer') || (()=>{
        const c = document.createElement('div');
        c.id = 'toastContainer';
        c.style.cssText = 'position:fixed;top:60px;right:20px;z-index:9999';
        document.body.appendChild(c);
        return c;
    })();
    const t = document.createElement('div');
    t.className = `toast align-items-center text-bg-${type} border-0 show`;
    t.innerHTML = `<div class="d-flex"><div class="toast-body">${escapeHtml(msg)}</div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
    container.appendChild(t);
    setTimeout(()=>t.remove(), 4000);
}

// 自动刷新设备列表
setInterval(refreshDevices, 5000);
refreshDevices();
</script>
{% endblock %}
